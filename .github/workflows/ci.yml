name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avoir-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: avoir-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  backend:
    name: Backend (tests + import smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check all modules
        run: python -m compileall -q .

      - name: Run unit tests
        shell: bash
        run: |
          if [ -f test_alpha_brief.py ]; then
            python -m unittest test_alpha_brief -v
          else
            echo "test_alpha_brief.py not present yet — skipping"
          fi

      - name: Server imports cleanly
        run: python -c "import server"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked secrets
        shell: bash
        run: |
          set -e
          matches=$(rg -n --hidden -g '!.git/**' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'sk_live_[a-zA-Z0-9]{16,}' \
            -e 'AIza[0-9A-Za-z_-]{35}' \
            -e 'ghp_[a-zA-Z0-9]{36}' \
            -e 'xox[baprs]-[a-zA-Z0-9-]{10,}' \
            -e '-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----' \
            . || true)
          if [ -n "$matches" ]; then
            echo "Potential secret leak detected:"
            echo "$matches"
            exit 1
          fi
          echo "No secrets found"
