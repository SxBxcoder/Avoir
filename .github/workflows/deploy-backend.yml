name: Deploy Backend (AWS Lambda)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle code and dependencies
        working-directory: backend
        run: |
          mkdir -p package
          pip install -r requirements.txt -t package/
          cp *.py package/
          rm -rf package/test_*.py package/__pycache__ package/*/__pycache__
          cd package
          zip -rq ../backend-deploy.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to Lambda
        working-directory: backend
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FN_NAME }} \
            --zip-file fileb://backend-deploy.zip
